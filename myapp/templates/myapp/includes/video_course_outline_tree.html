{% for node in content_tree %}
<details class="vc-folder" data-folder-name="{{ node.folder.name|lower }}" {% if forloop.first %}open{% endif %}>
  <summary>
    <span class="vc-folder-icon">▻</span>
    <span class="vc-folder-heading"><strong>{{ node.folder.name }}</strong><small>{{ node.item_count }} video{{ node.item_count|pluralize }}</small></span>
    <span class="vc-folder-arrow" aria-hidden="true"></span>
  </summary>
  <div class="vc-folder-body">
    {% for video in node.items %}
    <button type="button" class="vc-video-row" data-src="{{ video.video_file.url }}" data-title="{{ video.title }}" data-search-text="{{ video.title|lower }}">
      {% if course.thumbnail %}<img src="{{ course.thumbnail.url }}" alt="">{% else %}<span class="vc-video-placeholder">▶</span>{% endif %}
      <span class="vc-video-info"><strong>{{ video.title }}</strong><small>▣ {% if video.duration_minutes %}{{ video.duration_minutes }} minutes{% else %}Video lesson{% endif %}</small></span>
      <span class="vc-video-play" aria-hidden="true">▶</span>
    </button>
    {% endfor %}
    {% if node.children %}{% include "myapp/includes/video_course_outline_tree.html" with content_tree=node.children %}{% endif %}
  </div>
</details>
{% endfor %}
